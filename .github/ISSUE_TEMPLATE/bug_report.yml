name: Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select one screen
        2. Drag Contrast to 0
        3. ...
  - type: input
    id: version
    attributes:
      label: App version and Windows version
      placeholder: e.g. 1.0.0, Windows 11 24H2
  - type: textarea
    id: log
    attributes:
      label: MonitorControl.log
      description: The log sits next to MonitorControl.exe. Paste the last lines.
      render: text
